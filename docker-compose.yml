services:
  mysql:
    image: mysql:8
    container_name: eduflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: eduflow_dev
      MYSQL_DATABASE: eduflow
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - eduflow-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-peduflow_dev",
        ]
      interval: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduflow-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:eduflow_dev@mysql:3306/eduflow
      JWT_SECRET: change-this-before-deploy
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - full

volumes:
  eduflow-mysql-data:
